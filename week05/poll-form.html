<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Poll</title>
    <link rel="stylesheet" href="styles/poll-form.css">
</head>

<body>
    <header>
        <h1>WDD130 | HTML Form - User Poll</h1>
    </header>
    <main>
        <form>
            <fieldset>
                <legend>Contact Information</legend>
                <div class="form-item column2">
                    <label for="fullname">Full name:</label>
                    <input type="text" id="fullname" name="fullname" required>
                </div>
                <div class="form-item column2">
                    <label for="email">Email:</label>
                    <input type="email" id="useremail" name="useremail" required>
                </div>
            </fieldset>

            <fieldset>
                <legend>Questions</legend>
                <div class="form-item column2 column1">
                <label for="Browser">Select your favorite browser:</label>
                <select name="What is your favorite browser?" id="Browser">
                    <option value="0">Tor</option>
                    <option value="1">Chrome</option>
                    <option value="2">Brave</option>
                    <option value="3">Safari</option>
                </select>
            </div>
            <div class="form-item column2 column1">
                <label for="pet">Do you have a household pet?</label>
                <input type="checkbox" id="pet" name="pet">
            </div>
            <div class="form-item-full">
                <label for="feedback">List the places you have lived.</label>
                <textarea name="feedback" id="feedback" rows="4"
                placeholder=" Lusaka, Kafue, Matero Chunga, Chipata Mbangombe Katete"></textarea>
            </div>
            </fieldset>

            <div class="submit-row">
                <button type="submit">Submit Poll</button>
            </div>
        </form>
    </main>
    <footer>
        <p>©2026 | HTML Form - User Activity | Mike Chishala</p>
    </footer>
</body>

</html>
